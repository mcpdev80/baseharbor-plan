name: PR16 planning sync

on:
  pull_request:
    paths:
      - .github/workflows/pr16-sync.yml
  push:
    branches:
      - fix/r27-release-prepare-board-separation
    paths:
      - .github/workflows/pr16-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate and validate
        run: |
          python3 scripts/release_cycles.py sync
          python3 scripts/plan.py render
          python3 scripts/plan.py check
          python3 -m unittest discover -s scripts/tests
      - name: Commit generated planning updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore(planning): synchronize release cards and CardBoard views"
            git push origin HEAD:fix/r27-release-prepare-board-separation
          fi
