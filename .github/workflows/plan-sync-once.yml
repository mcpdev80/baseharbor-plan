name: One-time planning render and validate

on:
  push:
    paths:
      - '.github/workflows/plan-sync-once.yml'

permissions:
  contents: write

concurrency:
  group: one-time-plan-sync
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Run canonical planning generator
        run: |
          set -euo pipefail
          python3 scripts/release_cycles.py sync
          python3 scripts/plan.py render
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/plan.py check
      - name: Commit generated views and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/plan-sync-once.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "plan(v0.4.28): render and validate Obsidian Kanban views"
            git push origin HEAD:main
          fi
