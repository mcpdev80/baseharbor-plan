name: One-time r27 qualification handoff sync
on:
  push:
    paths:
      - '.github/workflows/plan-r27-qualify-sync-once.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Canonical release sync and validated Kanban
        run: |
          set -euo pipefail
          python3 scripts/release_cycles.py sync
          python3 scripts/plan.py render
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/plan.py check
      - name: Commit generated state and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/plan-r27-qualify-sync-once.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "plan(v0.4.27): render qualification-only Wait cards"
            git push origin HEAD:main
          fi
