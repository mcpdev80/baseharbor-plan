name: One-time v0.4.28 ready-on-r27-close cutover
on:
  push:
    paths:
      - '.github/workflows/plan-ready-cutover-once.yml'
permissions:
  contents: write
concurrency:
  group: one-time-r28-ready-cutover
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure dependency-gated early readiness
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("tasks")
          verify="t-20261017-release-0-4-27-verify"
          cleanup=root/"t-20261017-release-0-4-28-cleanup.md"
          updates=root/"t-20261017-release-0-4-28-updates.md"
          # The release cutover is an actual accepted publication verification,
          # not a tag assumption or a fabricated task closure.
          text=cleanup.read_text()
          old="depends_on: []"
          assert old in text, "cleanup prerequisites changed; stop and inspect"
          text=text.replace(old, f"depends_on: [{verify}]", 1)
          cleanup.write_text(text)
          modified=[cleanup,updates]
          # Only the v0.4.28 implementations/engineering slices and the three
          # startup/prepare cards can become ready ahead of a manual release-status flip.
          # Their actual accepted predecessors remain mandatory.
          for p in sorted(root.glob("*.md")):
              if p in modified:
                  continue
              data=p.read_text()
              head,sep,body=data.partition("\n---\n")
              if not sep or not head.startswith("---\n"):
                  continue
              if "\nrelease: v0.4.28\n" not in head+"\n":
                  continue
              stage=None
              for line in head.splitlines():
                  if line.startswith("release_stage: "):
                      stage=line.split(": ",1)[1]
              if stage in ("qualify","publish","verify"):
                  continue
              if "early: true" in head:
                  continue
              if "early:" in head:
                  raise RuntimeError(f"inspect unexpected early policy: {p}")
              p.write_text(head+"\nearly: true"+sep+body)
              modified.append(p)
          for p in (cleanup,updates):
              data=p.read_text()
              head,sep,body=data.partition("\n---\n")
              assert sep and head.startswith("---\n")
              if "early: true" not in head:
                  assert "early:" not in head
                  p.write_text(head+"\nearly: true"+sep+body)
          # In particular the existing Go shard reuse and console-2 notes
          # remain attached to v0.4.28 and retain their predecessors.
          print("Cutover-ready notes configured:",len(modified))
          PY
          python3 scripts/release_cycles.py sync
          python3 scripts/plan.py render
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/plan.py check
          python3 scripts/plan.py list --ready --release v0.4.28
      - name: Commit canonical generated views and self-remove
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/plan-ready-cutover-once.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "plan(v0.4.28): auto-ready after accepted v0.4.27 closeout"
            git push origin HEAD:main
          fi
