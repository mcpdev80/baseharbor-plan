name: Complete native Ready Kanban migration

on:
  push:
    branches: [main]
    paths:
      - scripts/migrate_bases_kanban.py

permissions:
  contents: write

concurrency:
  group: planning-native-ready-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Migrate, render and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/migrate_bases_kanban.py
          python3 scripts/plan.py render
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/plan.py check
      - name: Commit migrated notes and generated dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tasks/ views/ roadmap/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(planning): populate Ready lanes and concise card summaries"
          git push origin HEAD:main
