name: Validate planning

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Plan · validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sync generated planning files for PR16
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/r27-release-prepare-board-separation'
        run: |
          python3 scripts/release_cycles.py sync
          python3 scripts/plan.py render
          python3 scripts/plan.py check
          python3 -m unittest discover -s scripts/tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore(planning): render release cards and CardBoard views"
            git push origin HEAD:fix/r27-release-prepare-board-separation
          fi
      - name: Unit tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate vault and generated files
        run: python3 scripts/plan.py check

      - name: Diagnose generated drift using the actual planning generator
        if: failure()
        run: |
          python3 scripts/release_cycles.py sync
          python3 scripts/plan.py render
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=M"], text=True).splitlines()
          for name in changed:
              if name.endswith(".md") or name in {"migration/manifest.json"}:
                  print("PLANNING_GENERATED_FILE " + json.dumps(
                      {"path": name, "content": Path(name).read_text()}, ensure_ascii=True))
          PY
