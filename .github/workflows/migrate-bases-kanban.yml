name: One-time native Bases task migration
on:
  push:
    branches: [main]
    paths:
      - scripts/migrate_bases_kanban.py

permissions:
  contents: write

concurrency:
  group: planning-native-bases-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate all task properties and render board
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Migrate and validate canonical planning
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/migrate_bases_kanban.py
          python3 scripts/plan.py render
          python3 scripts/plan.py check
      - name: Commit complete synchronized board
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tasks/ views/ roadmap/
          if git diff --cached --quiet; then
            echo "No pending Kanban migration"
            exit 0
          fi
          git commit -m "chore(planning): migrate all tasks and render native Bases board"
          git push origin HEAD:main
