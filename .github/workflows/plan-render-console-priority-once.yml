name: One-time Console planning priority reconciliation
on:
  push:
    paths:
      - '.github/workflows/plan-render-console-priority-once.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Canonical plan validation and render
        run: |
          set -euo pipefail
          python3 scripts/release_cycles.py sync
          python3 scripts/plan.py render
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/plan.py check
      - name: Commit generated views and remove workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/plan-render-console-priority-once.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "plan(v0.4.28): sync priority and Console umbrella to Obsidian"
            git push origin HEAD:main
          fi
