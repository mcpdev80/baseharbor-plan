name: One-time v0.4.27 release-cut reconcile
on:
  push:
    paths:
      - '.github/workflows/plan-r27-release-cut-once.yml'
permissions:
  contents: write
concurrency:
  group: r27-release-cut-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile and validate release cut
        run: |
          set -euo pipefail
          python3 scripts/release_cycles.py sync
          python3 scripts/plan.py render
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/plan.py check
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          from plan import Vault
          v=Vault(Path(".").resolve()).load().validate()
          assert not v.errors, "\n".join(v.errors[:30])
          outstanding=[t for t in v.tasks.values() if t["release"]=="v0.4.27" and not t["done"]]
          cross=[(t["id"],d) for t in outstanding for d in t["depends_on"] if d in v.tasks and v.tasks[d]["release"]=="v0.4.28"]
          print("R27 outstanding after scope cut:",len(outstanding))
          print("R27 unexpected dependencies on R28:",cross)
          assert not cross, "Do not leave release-27 work blocked on release-28 feature work"
          assert len(outstanding)==14, f"Expected 10 remaining engineering/acceptance tasks plus four release stages, got {len(outstanding)}"
          assert sum(1 for t in v.tasks.values() if t["release"]=="v0.4.28" and not t["done"])>=50
          PY
      - name: Commit generated views and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/plan-r27-release-cut-once.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "plan(v0.4.27): sync audited release cut and v0.4.28 board"
            git push origin HEAD:main
          fi
