name: App-ID proof planning closeout

on:
  push:
    branches: [close/r27-appid-repo-workflow-proof]
    paths: [.github/workflows/appid-proof-sync.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Render and validate
        run: |
          python3 scripts/plan.py render
          python3 scripts/plan.py check
          python3 -m unittest discover -s scripts/tests
      - name: Commit generated views
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore(planning): render accepted app-id proof card"
            git push origin HEAD:close/r27-appid-repo-workflow-proof
          fi
